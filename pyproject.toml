[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markpad"
version = "2.0.0"
description = "A blazing-fast, beautiful Markdown editor with instant live preview"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MarkPad Contributors"}
]
keywords = ["markdown", "editor", "preview", "pyqt6", "writing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PyQt6>=6.5.0",
    "PyQt6-WebEngine>=6.5.0",
    "markdown>=3.5",
    "Pygments>=2.17",
    "emoji>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "flake8>=6.0",
    "black>=23.0",
]

[project.scripts]
markpad = "markpad.app:main"

[project.urls]
Homepage = "https://github.com/zamin-naqvi/MarkPad"
Repository = "https://github.com/zamin-naqvi/MarkPad"
"Bug Tracker" = "https://github.com/zamin-naqvi/MarkPad/issues"

[tool.setuptools.packages.find]
include = ["markpad*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
